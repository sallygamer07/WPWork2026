<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>웹프로젝트 종합과제 | 202680059 홍예은</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <header>
      <h2>나만의 책장</h2>
      <h3>My <br />Bookshelf</h3>
    </header>
    <nav>
      <input type="button" value="전체" onclick="filterBooks('all')" />
      <input type="button" value="문학" onclick="filterBooks('literature')" />
      <input type="button" value="비문학" onclick="filterBooks('nonfiction')" />
      <input type="button" class="subNavBtn" value="테마 변경" />
    </nav>

    <main>
      <section></section>
      <aside>
        <div class="bookPanel">
          <img src="img/book_01.png" alt="책 표지" />
          <div class="bookInfo">
            <h3>책 제목 팝업</h3>
            <hr />
            <p>저자 |</p>
            <p>출판사 |</p>
            <p>출간일 |</p>
            <p>장르 |</p>
            <br />
            <div class="bookDescription">
              <h4>서평</h4>
              <hr />
              <p>내용</p>
            </div>
            <div class="bookStar">
              <span>★</span>
              <span>★</span>
              <span>★</span>
              <span>★</span>
              <span>★</span>
            </div>
          </div>
          <input type="button" value="X" />
        </div>
      </aside>
    </main>

    <footer>
      <div class="audioPlayer">
        <span style="color: #606c38; padding: 10px 10px 0 0">BGM</span>
        <audio src="audio/Morning.mp3" controls></audio>
      </div>
      <p>202680059 홍예은 <br />웹프로그래밍 G반 종합 프로젝트 과제</p>
    </footer>
  </body>
</html>
